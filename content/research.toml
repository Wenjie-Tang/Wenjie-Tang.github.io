[[items]]
eyebrow = "Current research · VR safety"
title = "Safe Passage: Diegetic Safety Events for Public VR Exergames"
affiliation = "FIT-AWE Lab, The Hong Kong University of Science and Technology (Guangzhou)"
role = "Research Assistant"
advisor = "Advisor: Prof. Haining Liang"
date = "July 2026-Present"
status = "In preparation for IEEE VR 2027"
content = "Leading the design of a closed-loop safety mechanism for shared-space VR exergames. Safe Passage represents bystanders diegetically and mediates passage space by redirecting or removing conflicting targets while preserving fair scoring opportunities. The Unity prototype supports comparison with an event-triggered Passthrough AR baseline through behavioral safety, gameplay continuity, and subjective experience measures."
metrics = ["Closed-loop safety intervention", "VR vs. Passthrough AR baseline"]
tags = ["Extended Reality", "Embodied Interaction", "VR Safety"]
methods = ["Unity", "C#", "PICO SDK", "XR Interaction Toolkit", "Behavioral Logging"]
teaser = "XR-01"
teaser_label = "Diegetic safety for shared-space VR"

[[items]]
eyebrow = "Current research · AI writing"
title = "Preserving Authorship-Critical Decision Rights in Personalized AI Writing"
affiliation = "Central South University"
role = "Project Leader"
advisor = "Advisor: Prof. Yuhui Wang"
date = "June 2026-Present"
status = "Pilot study completed"
content = "Investigating how personalized AI writing changes psychological ownership, agency, and authorship certainty. A two-stage framework separates mechanism discovery from design validation. A 2×2 factorial pilot and edit-trace analysis inform the Authorship Anchors interaction paradigm—Claim, Evidence, and Commitment—which aims to preserve core decision rights while AI supports surface-level English execution. Pilot findings are treated as formative evidence, not causal conclusions."
metrics = ["2×2 factorial pilot", "N=15", "Edit-trace analysis"]
tags = ["Human-AI Interaction", "AI Writing", "Creativity Support"]
methods = ["HTML/CSS/JavaScript", "OpenAI API", "Behavior Logging", "Controlled Experiments"]
teaser = "HAI-02"
teaser_label = "Authorship anchors for personalized AI writing"


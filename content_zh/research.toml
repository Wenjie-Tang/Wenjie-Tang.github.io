status = "已完成先导实验"
content = "研究个性化 AI 写作如何改变心理所有权、能动性与作者身份确定性。两阶段框架将机制发现与设计验证分开。2×2 析因先导实验与编辑轨迹分析用于形成 Authorship Anchors 交互范式，包括主张、证据与承诺，旨在由 AI 承担表层英语表达时保留用户核心决策权。先导结果仅作为形成性证据，不作因果结论。"
metrics = ["2×2 析因先导实验", "N=15", "编辑轨迹分析"]
tags = ["人机交互", "AI 写作", "创造力支持"]
methods = ["HTML/CSS/JavaScript", "OpenAI API", "行为日志", "控制实验"]
teaser = "HAI-02"
teaser_label = "个性化 AI 写作中的作者身份锚点"

